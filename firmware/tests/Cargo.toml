# Bare-metal test firmware for the emulator's tests (see ../README.md): one
# crate each, sharing testrt, link.ld and build.rs. Standalone, not part of
# the emulator's workspace.
[workspace]
resolver = "3"
members = ["testrt", "adc-test", "batch-timer", "button-led", "cpu-bench", "i2c-test", "io-test", "irq-timer", "multicore-test", "pio-test", "sd-test", "spin-test", "spi-dma-test", "uart-echo", "uart-hello"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
testrt = { path = "testrt" }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
opt-level = "s"

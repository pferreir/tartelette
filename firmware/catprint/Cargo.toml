[package]
name = "catprint"
version = "0.1.0"
edition = "2024"

# Standalone (not part of the emulator workspace): THE DAILY BIT, a Pico W on
# a Pico Display Pack 2.0 (`boards/pico-w-display.board`) that gathers a few
# things from the internet over Wi-Fi and prints them as a receipt on an
# MXW01 "cat printer" over Bluetooth LE. Build with
#   CYW43_FIRMWARE_DIR=/path/to/cyw43-firmware cargo build --release
# Same Embassy and trouble revisions as `firmware/ble-test`.

[workspace]

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-time = { version = "0.5.1", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-net = { version = "0.9", features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet", "dns", "proto-ipv4"] }
embassy-sync = "0.8"
embassy-futures = "0.1.2"
trouble-host = { git = "https://github.com/embassy-rs/trouble.git", branch = "main", features = ["defmt", "scan", "default-packet-pool-mtu-128"] }
bt-hci = "0.11"
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs", "bluetooth"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.0"
static_cell = "2"
portable-atomic = { version = "1.5", features = ["critical-section"] }
embedded-io-async = "0.7"
embedded-graphics = "0.8"
heapless = "0.9"
libm = "0.2"

[patch.crates-io]
cyw43 = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-rp = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-net = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-net-driver = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy.git", rev = "3cd51e6d8eb6aff8b0d64d9e56a75a538bcfc65a" }

[profile.release]
debug = 2
lto = true
opt-level = "s"

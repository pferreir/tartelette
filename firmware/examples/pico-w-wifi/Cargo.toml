[package]
name = "pico-w-wifi"
version = "0.1.0"
edition = "2021"

# Standalone (not part of the emulator workspace). Pico W Wi-Fi examples on
# Embassy's cyw43 driver; see ../README.md. The emulator's tests run them
# against the emulated CYW43439 (crates/app/tartelette/tests/wifi_firmware.rs).
# The versions are the ones Embassy shipped together in August 2024.

[workspace]

[dependencies]
embassy-executor = { version = "0.6.0", features = ["task-arena-size-65536", "arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "integrated-timers"] }
embassy-time = { version = "0.3.2", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.2.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
embassy-net = { version = "0.4.0", features = ["defmt", "tcp", "udp", "dhcpv4", "medium-ethernet", "dns"] }
cyw43 = { version = "0.2.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.2.0", features = ["defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"

[build]
target = "thumbv6m-none-eabi"
# The repository's target/, where the emulator's tests build it too.
target-dir = "../../../target/firmware/pico-w-ble"

# `cargo run` runs the firmware in tartelette, or flashes a real board with
# TARTELETTE_RUNNER=probe-rs or picotool: see ../run.
[target.thumbv6m-none-eabi]
runner = ["../run", "pico-w", "--bt", "mock", "--"]

[env]
DEFMT_LOG = "debug"

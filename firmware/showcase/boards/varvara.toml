#:schema ../../../boards/board.schema.json
# VARVARA: a Pico as a Varvara computer, for Uxn programs. A 320x240 ST7789
# wired as on the Pico Display Pack 2.0, the eight buttons of the Varvara
# controller (to GND, read with the RP2040's pull-ups), a speaker on GPIO16,
# an SD card slot for ROMs and the File device, and a PS/2 mouse. The
# firmware is src/bin/varvara/; the README in the directory above says how
# to run it.
name = "Varvara"

[buses]
spi0 = { sck = 18, mosi = 19 }
spi1 = { sck = 14, mosi = 15, miso = 12 }

[parts.screen]
kind = "st7789"
bus = "spi0"
cs = 9
dc = 13
bl = 17

[parts.up]
kind = "button"
gpio = 2

[parts.down]
kind = "button"
gpio = 3

[parts.left]
kind = "button"
gpio = 4

[parts.right]
kind = "button"
gpio = 5

[parts.a]
kind = "button"
gpio = 6

[parts.b]
kind = "button"
gpio = 7

[parts.select]
kind = "button"
gpio = 8

[parts.start]
kind = "button"
gpio = 10

# Behind GPIO16, an RC low-pass, a coupling capacitor and an amplifier; the
# PWM runs at 25 kHz, a sample a period.
[parts.speaker]
kind = "speaker"
gpio = 16
rate = 25000

# Empty until a card is put in (`--sd sd=card.img`, or Load…); roms/card.sh
# makes one with ROMs on it.
[parts.sd]
kind = "sdcard"
bus = "spi1"
cs = 11

# For the Mouse device, with its wheel: the lines open-drain, with the
# RP2040's pull-ups.
[parts.mouse]
kind = "ps2mouse"
clk = 20
data = 21

# Laid out as a handheld: the D-pad left of the screen, A and B right of it.
[panel]
screen = { at = [3, 0], span = [6, 4], rotate = 270 }
up = { at = [1, 1], label = "Up", key = "ArrowUp" }
left = { at = [0, 2], label = "Left", key = "ArrowLeft" }
right = { at = [2, 2], label = "Right", key = "ArrowRight" }
down = { at = [1, 3], label = "Down", key = "ArrowDown" }
b = { at = [9, 2], label = "B", key = "Z" }
a = { at = [10, 1], label = "A", key = "X" }
select = { at = [4, 4], label = "Select", key = "Space" }
start = { at = [5, 4], label = "Start", key = "Enter" }
speaker = { at = [7, 4], label = "Speaker" }
sd = { at = [9, 3], span = [2, 1], label = "SD card" }
mouse = { at = [0, 4], span = [3, 1], label = "Mouse" }

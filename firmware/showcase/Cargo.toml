[package]
name = "showcase"
version = "0.1.0"
edition = "2021"

# Standalone (not part of the emulator workspace). The demos on tartelette's
# web page, one binary each, on plain RP2040 boards (no Wi-Fi blobs needed);
# see README.md. `src/lib.rs` has the bits they share.

[workspace]

[dependencies]
embassy-executor = { version = "0.10", default-features = false, features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-time = { version = "0.5.1", default-features = false, features = ["defmt", "defmt-timestamp-uptime"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-futures = "0.1"
embassy-sync = "0.8"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.6" }
cortex-m-rt = "0.7.0"
embedded-graphics = "0.8"
smart-leds = "0.4"
static_cell = "2.1"
heapless = "0.8"
libm = "0.2"
portable-atomic = { version = "1.5", features = ["critical-section"] }
embedded-io-async = "0.7"

[profile.release]
debug = 2
lto = true
opt-level = 3

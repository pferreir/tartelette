[workspace]
resolver = "3"
members = ["crates/*/*", "tools/*"]
# Its own workspace: built for wasm32 alone, see scripts/web-bench.sh.
exclude = ["tools/web-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = "s"

[package]
name = "tartelette"
description = "An RP2040 emulator that runs firmware on an emulated board, with a front panel or headless"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp2040-core = { path = "../../core/rp2040-core" }
pcb = { path = "../../board/pcb" }
pcb-devices = { path = "../../board/pcb-devices" }
tartelette-runtime = { path = "../tartelette-runtime" }
sdimage = { path = "../../board/sdimage" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
rfd = "0.17.2"
web-time = "1.1.0"
midir = "0.11.1"
rtt = { path = "../../host/rtt" }
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
web-sys = { version = "0.3.106", features = ["Blob", "Url", "HtmlAnchorElement", "Document", "Window", "Element", "EventTarget", "HtmlCanvasElement", "MouseEvent", "console", "Location", "MessageChannel", "MessagePort", "Response", "UrlSearchParams"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
mkdisk = { path = "../mkdisk" }
tartelette-runtime = { path = "../tartelette-runtime", features = ["clap"] }
clap = { version = "4.6.7", features = ["derive"] }

# wgpu (Direct3D 12, Vulkan) for the front panel on Windows, as well as
# OpenGL: see `window` in src/main.rs.
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }

[dev-dependencies]
usbhost = { path = "../../core/usbhost" }

[package]
name = "tartelette-runtime"
description = "Runs firmware on an emulated RP2040 board, with no UI: sessions, pacing, board files, and the host's side of the USB, UART and radio links"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Lets a command line take `NetMode` as a `clap` value.
clap = ["dep:clap"]

[dependencies]
rp2040-core = { path = "../../core/rp2040-core" }
pcb = { path = "../../board/pcb" }
pcb-devices = { path = "../../board/pcb-devices" }
rtt = { path = "../../host/rtt" }
usbhost = { path = "../../core/usbhost" }
web-time = "1.1.0"
midir = "0.11.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bridge-net = { path = "../../host/bridge-net" }
bridge-hci = { path = "../../host/bridge-hci" }

[target.'cfg(target_os = "linux")'.dependencies]
bridge-usb = { path = "../../host/bridge-usb" }

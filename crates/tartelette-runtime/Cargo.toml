[package]
name = "tartelette-runtime"
description = "Runs firmware on an emulated RP2040 board, with no UI: sessions, pacing, board files, and the host's side of the USB, UART and radio links"
version.workspace = true
edition.workspace = true

[features]
# Lets a command line take `NetMode` as a `clap` value.
clap = ["dep:clap"]

[dependencies]
rp2040-core = { path = "../rp2040-core" }
pcb = { path = "../pcb" }
pcb-devices = { path = "../pcb-devices" }
rtt = { path = "../rtt" }
usbhost = { path = "../usbhost" }
web-time = "1.1.0"
midir = "0.11.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
netstack = { path = "../netstack" }
hcibridge = { path = "../hcibridge" }

[target.'cfg(target_os = "linux")'.dependencies]
usbbridge = { path = "../usbbridge" }

[package]
name = "tartelette"
description = "An RP2040 emulator that runs firmware on an emulated board, with a front panel or headless"
version.workspace = true
edition.workspace = true

[dependencies]
rp2040-core = { path = "../rp2040-core" }
pcb = { path = "../pcb" }
pcb-devices = { path = "../pcb-devices" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
rfd = "0.17.2"
web-time = "1.1.0"
midir = "0.11.1"
rtt = { path = "../rtt" }
usbhost = { path = "../usbhost" }
image = { version = "0.25", default-features = false, features = ["png"] }
cpal = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.106"
wasm-bindgen-futures = "0.4.79"
cpal = { version = "0.18", features = ["wasm-bindgen"] }
web-sys = { version = "0.3.106", features = ["Blob", "Url", "HtmlAnchorElement", "Document", "Window", "Element", "HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
netstack = { path = "../netstack" }
hcibridge = { path = "../hcibridge" }
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
usbbridge = { path = "../usbbridge" }

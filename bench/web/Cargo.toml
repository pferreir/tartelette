[package]
name = "web-bench"
version = "0.1.0"
edition = "2024"

# Standalone (not part of the emulator workspace): the emulator core as a
# bare WebAssembly module for timing it in browsers. See
# scripts/web-bench.sh, which builds it with and without WebAssembly tail
# calls.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rp2040-core = { path = "../../crates/rp2040-core" }

[profile.release]
lto = "fat"
codegen-units = 1

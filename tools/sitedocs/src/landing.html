<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="icon" href="img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Saira+Semi+Condensed:wght@500;700&display=swap" rel="stylesheet">
<!-- The landing page's layout. Its text is in site/index.md. -->
  <style>
    :root {
      --paper: #fdfdfb;
      --ink: #141414;
      --dim: #62625e;
      --rule: #141414;
      --hair: #d4d4cf;
      --pad: #a8822a;
      --go: #146c3f;
      --go-ink: #fdfdfb;
      --screen: #222;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      --cond: "Saira Semi Condensed", "Arial Narrow", sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #1b1b1c;
        --ink: #ddd6c4;
        --dim: #8f8a7e;
        --rule: #ddd6c4;
        --hair: #3a3936;
        --pad: #c9a548;
        --go: #6cc993;
        --go-ink: #10140f;
        --screen: #0e0e0e;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --paper: #1b1b1c; --ink: #ddd6c4; --dim: #8f8a7e; --rule: #ddd6c4; --hair: #3a3936;
      --pad: #c9a548; --go: #6cc993; --go-ink: #10140f; --screen: #0e0e0e; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.6 "IBM Plex Sans", system-ui, sans-serif;
    }
    a { color: inherit; text-decoration-color: var(--pad); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
    a:hover { text-decoration-color: currentColor; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

    /* The running header of a datasheet page. */
    .running {
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      font: 500 0.72rem/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--dim);
      padding: 14px 0 10px;
      border-bottom: 2px solid var(--rule);
    }
    .running a { text-decoration: none; }
    .running a:hover { color: var(--ink); }
    .running .nav { display: flex; gap: 18px; }

    /* A row of package leads, as on the logo's chip. */
    .leads {
      height: 9px;
      background: repeating-linear-gradient(90deg, var(--pad) 0 3px, transparent 3px 9px);
      opacity: 0.7;
    }

    header.top {
      display: grid;
      grid-template-columns: 210px 1fr;
      gap: 40px;
      align-items: end;
      padding: 44px 0 30px;
    }
    header.top img { width: 100%; height: auto; display: block; }
    h1 {
      font: 700 clamp(2.6rem, 7vw, 4.6rem)/0.9 var(--cond);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0 0 18px;
    }
    .sub { font: 500 0.82rem/1.4 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); margin: 0 0 18px; }
    .intro { margin: 0; max-width: 40em; }
    .intro + .intro { margin-top: 10px; }

    h2.sec {
      font: 700 0.95rem/1 var(--cond);
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin: 48px 0 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--rule);
      display: flex; justify-content: space-between; gap: 12px;
    }
    h2.sec span { font: 400 0.75rem/1 var(--mono); letter-spacing: 0.04em; text-transform: none; color: var(--dim); align-self: end; }

    .demo {
      display: grid;
      grid-template-columns: 3.2rem minmax(0, 1.15fr) minmax(0, 1fr);
      gap: 0 28px;
      padding: 30px 0;
      border-bottom: 1px solid var(--hair);
    }
    .demo .no { font: 500 0.85rem/1 var(--mono); color: var(--pad); padding-top: 0.45rem; }
    .demo .shot {
      display: block; position: relative;
      background: var(--screen);
      border: 1px solid var(--rule);
      align-self: start;
    }
    .demo .shot img { width: 100%; height: auto; display: block; aspect-ratio: 760 / 475; }
    /* Pin 1. */
    .demo .shot::after {
      content: ""; position: absolute; left: 7px; top: 7px;
      width: 7px; height: 7px; border-radius: 50%; background: var(--pad);
    }
    .demo h3 {
      font: 700 1.9rem/1 var(--cond);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 0 0 12px;
    }
    .demo p { margin: 0 0 14px; }
    dl { margin: 0 0 18px; display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; font-size: 0.9rem; }
    dt { font: 500 0.7rem/1.9 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
    dd { margin: 0; }
    kbd {
      font: 500 0.76rem/1 var(--mono);
      border: 1px solid var(--ink);
      padding: 2px 5px 1px;
      white-space: nowrap;
    }
    .actions { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
    .run {
      font: 500 0.82rem/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em;
      background: var(--go); color: var(--go-ink);
      text-decoration: none;
      padding: 10px 14px 9px;
    }
    .run::after { content: " \25B8"; }
    .run:hover, .run:focus-visible { background: var(--ink); color: var(--paper); }

    pre {
      margin: 0;
      background: var(--screen);
      color: #e9e4d6;
      padding: 14px 16px;
      overflow-x: auto;
      font: 0.84rem/1.6 var(--mono);
      border-left: 3px solid var(--pad);
    }
    .demo pre { margin: -6px 0 16px; padding: 8px 12px; font-size: 0.8rem; }
    /* Highlighting (tools/sitedocs/src/highlight.rs), as on the docs pages. */
    pre .c { color: #8a857a; font-style: italic; }
    pre .s { color: #a7d39b; }
    pre .n { color: #f0a07e; }
    pre .k, pre .x { color: #e3c06a; }
    pre .h { color: #fdf7e6; font-weight: 500; }
    pre .f { color: #9cc4e4; }
    pre .v { color: #d9a3d6; }
    pre .p { color: #a39d90; }

    .local { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 28px; padding: 22px 0 8px; }
    .local p { margin: 0 0 12px; }
    .local blockquote { margin: 0; font-size: 0.84rem; color: var(--dim); }
    .local blockquote p { margin: 0; }

    footer {
      margin-top: 56px;
      font: 0.74rem/1.6 var(--mono);
      color: var(--dim);
    }
    footer .row { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 0 40px; border-top: 2px solid var(--rule); }

    @media (max-width: 820px) {
      header.top { grid-template-columns: 130px 1fr; gap: 22px; align-items: center; }
      .demo { grid-template-columns: 2.4rem minmax(0, 1fr); }
      .demo .shot { margin-bottom: 18px; }
      .demo .text { grid-column: 2; }
      .local { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      header.top { grid-template-columns: 1fr; padding-top: 28px; }
      header.top img { width: 120px; }
      .demo { grid-template-columns: 1fr; }
      .demo .no { padding: 0 0 8px; }
      .demo .text { grid-column: 1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="running">
      <span>{{HEADER}}</span>
      <span class="nav"><a href="docs/">docs</a><a href="{{REPO_URL}}">source on github &#8599;</a></span>
    </div>

    <header class="top">
      <img src="img/logo.png" alt="The tartelette logo: an RP2040 chip package with a tart engraved on it">
      <div>
{{INTRO}}
      </div>
    </header>
    <div class="leads" aria-hidden="true"></div>

{{SECTIONS}}
    <footer>
      <div class="leads" aria-hidden="true"></div>
      <div class="row">
        <span>{{FOOTER}}</span>
        <a href="{{REPO_URL}}">{{REPO_URL}}</a>
      </div>
    </footer>
  </div>
</body>
</html>
